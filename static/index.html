<!doctype html>
<meta charset="utf-8">
<title>Go East Travel Concierge</title>
<style>
  body { font: 15px system-ui; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  input, button { font: inherit; padding: 8px; }
  input { width: 70%; }
  pre { background: #f4f4f4; padding: 12px; overflow-x: auto; white-space: pre-wrap; }
</style>
<h1>Travel Concierge</h1>
<p><input id="q" placeholder="Book me a flight to Tokyo" autofocus>
<button onclick="ask()">Ask</button></p>
<pre id="out"></pre>
<script>
async function ask() {
  const out = document.getElementById('out');
  out.textContent = 'thinking...';
  const r = await fetch('/chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({message: document.getElementById('q').value, customer: 'cust1'})
  });
  const d = await r.json();
  out.textContent = `[${d.intent} -> ${d.agent}]\n\n${d.reply}`;
}
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
</script>
